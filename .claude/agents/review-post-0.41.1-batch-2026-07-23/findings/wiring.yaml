agent: wiring
findings:
  - id: F-wire-1
    severity: HIGH
    file: src/composer-editor.ts
    line: 329
    summary: seedEditorState seeds cursorOffset in code points while text-buffer uses UTF-16 code units, so an initialValue containing any astral char (emoji) leaves the cursor mid-surrogate and the next keystroke corrupts the text (reproduced).
    evidence: |
      src/composer-editor.ts:329:    buffer: { text, cursorOffset: [...text].length },
      src/text-buffer.ts (offset semantics are UTF-16 code units):
        86:    text: text.slice(0, cursorOffset) + insertion + text.slice(cursorOffset),
      Repro (tsx, against src/composer-editor.js):
        seedEditorState("a\u{1F600}") -> cursorOffset: 2, text.length: 3
        editorReducer(seeded, { type: "buffer", action: { type: "insert", text: "!" } })
        -> buffer.text === "a\ud83d!\ude00"   (lone surrogates)
        -> text.isWellFormed() === false
      The unit test asserts the same wrong unit (tautology):
        src/composer-editor.seed.test.ts:9: expect(s.buffer.cursorOffset).toBe([..."olá mund"].length)
      ("olá mund" is BMP-only, so the mismatch never fires in the test.)
    recommended_action: 'Seed with cursorOffset: text.length (UTF-16 code units — end-of-text in text-buffer''s own unit). Add a regression test seeding an emoji-bearing initialValue, dispatching an insert, and asserting the result is well-formed with the char appended at the end.'
