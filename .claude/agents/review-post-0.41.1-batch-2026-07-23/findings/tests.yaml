findings:
  - id: F-tests-1
    severity: HIGH
    file: src/composer-editor.ts
    line: 327
    summary: seedEditorState sets cursorOffset to the code-POINT count ([...text].length) but TextBufferState.cursorOffset is documented and consumed as a UTF-16 code-UNIT offset, so seeding text containing astral characters (emoji) places the cursor inside a surrogate pair and typing corrupts the text; the paired test (src/composer-editor.seed.test.ts:9) uses only BMP text ("ola mund", where the two counts coincide) and its comment mis-labels the count as "grapheme-aware", so the exact grapheme/astral edge case the feature exists for (restoring a previously typed user message, which can contain emoji) is untested and hides a real production bug.
    evidence: |
      // src/text-buffer.ts:13 — /** Cursor position as a code-unit offset into `text`. */
      // src/composer-editor.ts:329
      buffer: { text, cursorOffset: [...text].length },
      // src/composer-editor.seed.test.ts:9
      expect(s.buffer.cursorOffset).toBe([..."olá mund"].length); // grapheme-aware, fim
      # repro (node): seeding "hi 👍" then inserting "!" at the seeded offset
      # text.length(code units)= 5  seed cursorOffset= 4
      # typing after seed produces: "hi \ud83d!\udc4d"   <- '!' spliced between surrogate halves
    recommended_action: "Regression test first (testing.md § 3): add seed test cases with astral/ZWJ text, e.g. expect(seedEditorState(\"hi 👍\").buffer.cursorOffset).toBe(\"hi 👍\".length) and a follow-up insert through editorReducer asserting the text stays intact; then fix seedEditorState to use text.length (code units), matching move-end semantics (cursorOffset >= text.length). Also correct the misleading \"grapheme-aware\" comment."
