      export function seedEditorState(text: string | undefined): EditorState {
        if (!text) return initialEditorState;
        return {
          ...initialEditorState,
          buffer: { text, cursorOffset: [...text].length },   // code POINTS
        };
      }
      // src/text-buffer.ts:13-14 — the unit contract this violates:
      //   /** Cursor position as a code-unit offset into `text`. */
      //   cursorOffset: number;
