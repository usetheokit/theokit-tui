      //   typing X yields "ok \ud83dX\udc4b" (surrogate pair split)
      // The regression test (src/composer-editor.seed.test.ts:9) asserts
      // `[..."olá mund"].length`, which equals text.length for BMP-only input,
      // so it cannot catch this.
    recommended_action: 'Change seedEditorState to `cursorOffset: text.length` (code units, matching loadText and the TextBufferState doc), and extend composer-editor.seed.test.ts with an astral-tail regression case (e.g. seed "ok 👋", assert cursorOffset === 5 and that a subsequent insert appends after the emoji).'
