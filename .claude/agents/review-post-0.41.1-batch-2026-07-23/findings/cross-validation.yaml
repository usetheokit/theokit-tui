agent: cross-validation
findings:
  - id: F-xval-1
    severity: HIGH
    file: CHANGELOG.md
    line: 8
    summary: Six user-visible changes shipped to npm in 0.42.0-0.46.0 have NO CHANGELOG entry anywhere (Unreleased or versioned), and the five mid-range npm releases have neither CHANGELOG sections nor git tags.
    evidence: |
      package.json version history across the range: 0.41.1 -> 0.42.0 (f619fb6) -> 0.43.0 (c7e31d1)
      -> 0.44.0 (2011cea) -> 0.45.0 (f274a86) -> 0.46.0 (dd785c7). `git tag` ends at v0.41.1;
      CHANGELOG versioned sections jump from [Unreleased] straight to [0.41.1].
      Missing from CHANGELOG ANYWHERE:
        1. formatToolHeader hook (e92f775, shipped 0.42.0)
        2. ESC composer refocus fix (78d4316, shipped 0.42.0)
        3. formatToolResult seam (36dc357, shipped 0.43.0)
        4. assistant-message word-wrap fix (2011cea, shipped 0.44.0)
        5. ChatComposer initialValue prop (f274a86, shipped 0.45.0)
        6. ChatComposer onChange prop (dd785c7, shipped 0.46.0)
      Additionally the three [Unreleased] entries "Explored block" (line 12), "inline diff" (line 13)
      and "shell envelope" (line 31) come from commits 1323b44/595eea4/1d82aad which PRECEDE the
      0.42.0 bump — they already shipped to npm in 0.42.0, so [Unreleased] misrepresents them as
      unshipped. Borderline-missing: 217c2e0's VERSION-const drift fix (exported VERSION stuck at
      0.44.0 while npm published 0.45/0.46) has no Fixed entry.
    recommended_action: Before cutting 0.47.0, add the six missing entries to [Unreleased] (Added — formatToolHeader, formatToolResult, initialValue, onChange; Fixed — word-wrap, ESC refocus), each with its ref (#53, #10, M14, M54). Decide explicitly whether 0.47.0 release notes absorb everything since 0.41.1 (then say so in the 0.47.0 header) or whether retroactive 0.42.0-0.46.0 sections are reconstructed; also backfill or explicitly waive the missing v0.42.0-v0.46.0 git tags.
  - id: F-xval-2
    severity: HIGH
    file: src/messages-to-events.ts
    line: 365
    summary: formatToolHeader (published in npm 0.42.0, released via f619fb6) has ZERO test coverage anywhere in the tree.
    evidence: |
      Commit e92f775 "feat(events): formatToolHeader hook" touches ONLY src/messages-to-events.ts
      (26 insertions, no test file). At HEAD, `grep -rn formatToolHeader src/ tests/ --include='*.test.*'`
      returns nothing (exit 1). Its sibling formatToolResult (36dc357) DID land with a dedicated
      describe block ("messagesToAgentEvents — formatToolResult (result-body seam)",
      src/messages-to-events.test.ts:411) covering override/undefined-fallthrough — formatToolHeader
      got no equivalent. Violates rules/testing.md § 3 (every behavior needs a unit test) and the
      TDD-first unbreakable rule.
    recommended_action: Add unit tests for formatToolHeader mirroring the formatToolResult block — header override applied, undefined return leaves the raw tool name, and interaction with Explored grouping (read-only tools keep grouping, per the commit message claim which is currently untested).
  - id: F-xval-3
    severity: MEDIUM
    file: src/chat-composer.tsx
    line: 489
    summary: The ESC-refocus bug fix (78d4316) shipped without a regression test for the fixed path (ESC with no menu open).
    evidence: |
      78d4316 diff is +6 lines in src/chat-composer.tsx only — no test change. The pre-existing test
      escape_dismisses_and_typing_reopens (src/chat-composer.test.tsx:456, from cf89bfe, pre-range)
      covers the menu-open path; the bug being fixed was explicitly the NO-menu interrupt path
      ("the composer was only re-focused when a menu was open"). rules/testing.md § 3: "Every bug fix
      starts with a failing regression test, then the fix."
    recommended_action: Add a regression test asserting the composer accepts typed input after a lone ESC with no menu/shell/help overlay open (interrupt scenario consumed by agent-builder #10).
  - id: F-xval-4
    severity: MEDIUM
    file: src/index.ts
    line: 248
    summary: DEFAULT_EXPLORE_TOOLS is named in the CHANGELOG entry as the documented default but is NOT exported from the package entry — consumers cannot import it.
    evidence: |
      CHANGELOG.md line 12: "Configurable via messagesToAgentEvents(messages, { exploreTools }) —
      default DEFAULT_EXPLORE_TOOLS; pass [] to disable." The constant is `export const` in
      src/messages-to-events.ts:269 but the src/index.ts re-export block (lines 248-253) exports only
      findPendingApproval / messagesToAgentEvents / messagesToChatThread / readTurnUsage, and the
      package exposes only "." and "./renderer" subpaths — so an app cannot do
      `[...DEFAULT_EXPLORE_TOOLS, "my_read_tool"]` as the entry implies.
    recommended_action: Re-export DEFAULT_EXPLORE_TOOLS from src/index.ts (and pin it in tests/export-surface.test.ts), or reword the CHANGELOG entry to not name an unreachable symbol.
  - id: F-xval-5
    severity: MEDIUM
    file: .claude/knowledge-base/.compaction-snapshots/plan-20260716T200738Z.md
    line: 1
    summary: Commit f274a86 mixes three concerns — the initialValue feature, the 0.45.0 version bump, and an unrelated 323-line compaction-snapshot audit artifact.
    evidence: |
      f274a86 stat: .compaction-snapshots/plan-20260716T200738Z.md (+323), package.json version
      0.44.0 -> 0.45.0, src/chat-composer.tsx, src/composer-editor.ts, src/composer-editor.seed.test.ts.
      Commit message declares only the feature ("feat(chat-composer): initialValue seed prop").
      The snapshot file is audit trail from 2026-07-16, unrelated to the feature; the release bump is a
      separate concern (siblings 0.42.0/0.43.0 got dedicated chore(release) commits).
    recommended_action: Going forward keep release bumps in chore(release) commits (as f619fb6/c7e31d1 did) and never let stray audit-trail files ride a feature commit. No history rewrite (git-safety) — note-only for this range.
  - id: F-xval-6
    severity: LOW
    file: package.json
    line: 3
    summary: Releases 0.44.0, 0.45.0 and 0.46.0 have no chore(release) commit — the version bump is embedded inside the feature/fix commit itself.
    evidence: |
      2011cea (fix word-wrap) bumps 0.43.0->0.44.0 and syncs the VERSION const; f274a86 bumps ->0.45.0;
      dd785c7 bumps ->0.46.0. Contrast with f619fb6 / c7e31d1 which are dedicated release commits.
      This inconsistency is also what produced the VERSION-const drift that 217c2e0 later had to fix
      (const stuck at 0.44.0 while package.json said 0.46.0).
    recommended_action: Standardize on dedicated chore(release) commits (or the /release cycle) so version, VERSION const, CHANGELOG section and tag move together.
  - id: F-xval-7
    severity: LOW
    file: CHANGELOG.md
    line: 30
    summary: The settings-deny-rules Fixed entry is written in Portuguese in an otherwise English changelog, and documents internal repo config rather than a consumer-visible change.
    evidence: |
      Line 30: "Regras `deny` de permissão em `.claude/settings.json`: removidas as entradas..." —
      all sibling entries are English. It concerns .claude/settings.json (repo-internal tooling),
      which CLAUDE.md § 6 flags as an anti-pattern: "Misturar mudanças internas (refactor sem impacto
      externo) com mudanças visíveis ao consumidor."
    recommended_action: Translate to English and consider moving it out of the consumer CHANGELOG (commit message already records it) or keep it but mark it clearly as internal tooling.
  - id: F-xval-8
    severity: INFO
    file: .npmrc
    line: 1
    summary: 8af0580 bundles a contributor-facing .npmrc change (auto-install-peers=false) with the ai-sdk removal; declared in the commit message and CVE-neutral, but absent from CHANGELOG.
    evidence: |
      8af0580 adds .npmrc with auto-install-peers=false to keep the optional-figlet degrade contract
      test honest under pnpm 10. Declared in the commit body ("pnpm 10 was auto-installing the OPTIONAL
      figlet peer"), so scope is honest; consumer impact is nil, contributor impact (pnpm behavior) is real.
    recommended_action: Optional — one line in CHANGELOG Changed or the contributing docs noting pnpm auto-install-peers is disabled and why.
