agent: architecture
findings:
  - id: F-arch-1
    severity: HIGH
    file: src/composer-editor.ts
    line: 326
    summary: seedEditorState computes cursorOffset in code points ([...text].length) while every other text-buffer path treats cursorOffset as a UTF-16 string index — seeding an initialValue containing astral characters (emoji) places the cursor mid-surrogate.
    evidence: |
      // composer-editor.ts:326-332 (new M54 code)
      export function seedEditorState(text: string | undefined): EditorState {
        if (!text) return initialEditorState;
        return {
          ...initialEditorState,
          buffer: { text, cursorOffset: [...text].length },
        };
      }
      // Sibling path in the SAME file encodes "cursor at end" the UTF-16 way (loadText, history recall):
      //   buffer: { text, cursorOffset: text.length },
      // text-buffer.ts consumes cursorOffset as a raw string index throughout:
      //   text.slice(0, cursorOffset) + insertion + text.slice(cursorOffset)
      // For initialValue "hi 🙂": [...].length = 4 but .length = 5 → cursor lands between the
      // surrogate halves of the emoji; cursorSlices/graphemeAt then operate mid-surrogate.
      // The seed test (composer-editor.seed.test.ts) only uses BMP text ("olá mund"), where the
      // two counts coincide, so the divergence is untested.
    recommended_action: Use `cursorOffset: text.length` in seedEditorState (matching loadText), and add a regression test seeding an astral-character string (e.g. "a🙂") asserting cursorOffset === text.length. Consider extracting a single `bufferAtEnd(text)` helper so "cursor at end" has one authoritative encoding (DRY — the same knowledge currently lives in two divergent sites).

  - id: F-arch-2
    severity: MEDIUM
    file: src/agent-timeline.tsx
    line: 100
    summary: assertValidEvents does not recurse into `explored` events — nested AgentToolEvent ids skip the uniqueness set and nested tools skip status/exclusivity/maxLines validation, weakening the module's own ADR-D8 boundary-validation contract for a publicly constructible kind.
    evidence: |
      // assertValidEvents validates only top-level events:
      if (event.kind === "message") { validateMessageEvent(event); }
      if (event.kind === "tool")    { validateToolEvent(event); }
      // "explored" falls through with only kind + top-level-id checks. AgentExploredEvent is a
      // public member of the AgentEvent union, so a consumer can pass
      // { kind: "explored", tools: [...] } directly (not only via messagesToAgentEvents).
      // A duplicate id INSIDE tools (React key: tools.map((tool) => <Text key={tool.id} ...>))
      // or an invalid nested status is not caught at the declared structural boundary,
      // contradicting the module's stated rationale: "child-component guards would fire
      // mid-render where Ink's error boundary swallows throws (F10)".
    recommended_action: In assertValidEvents, when `event.kind === "explored"`, iterate `event.tools`, add each tool id to the shared `seen` set, and run validateToolEvent on each (plus assert tools.length >= 1 and kind === "tool" for members). Keeps the D8 fail-fast contract uniform across all four kinds.

  - id: F-arch-3
    severity: MEDIUM
    file: src/agent-stream-event.ts
    line: 137
    summary: The shared tool-result routing seam (routeToolResult, looksLikeUnifiedDiff, parseShellEnvelope, toShell, NormalizedShell) accreted into the module documented as "the structural stream-event union", giving it two reasons to change and forcing the non-stream message projection to import from a stream module.
    evidence: |
      // agent-stream-event.ts header: "Structural stream-event union (plan m7-stream-adapter ADR D1)"
      // — but ~120 of its 193 lines are now generic result-RENDERING routing shared by BOTH
      // projections:
      export function routeToolResult(value: unknown): { diff } | { shell } | { output } | undefined
      export function looksLikeUnifiedDiff(text: string): boolean
      export function parseShellEnvelope(raw: string): NormalizedShell | undefined
      // messages-to-events.ts:9 (a projection explicitly framed as message-snapshot, not stream):
      import { routeToolResult } from "./agent-stream-event.js";
      // SRP: the module changes when the SDK stream-event shape drifts AND when result-render
      // routing rules change (e.g. the apply_patch diff heuristic). The functions themselves are
      // cohesive with each other — they are just housed under the wrong roof.
    recommended_action: Extract the routing cluster (NormalizedShell, isShellEnvelope, toShell, parseShellEnvelope, looksLikeUnifiedDiff, routeToolResult) into a dedicated pure module (e.g. src/tool-result-routing.ts); agent-stream-event.ts re-exports for back-compat. Both projections then depend on the routing seam by name, and the stream-event module returns to its single ADR-D1 responsibility. Non-urgent — safe to schedule as a follow-up refactor since everything is internal.

  - id: F-arch-4
    severity: MEDIUM
    file: src/index.ts
    line: 253
    summary: DEFAULT_EXPLORE_TOOLS and the AgentExploredEvent type are not exported from the package root, so a consumer cannot extend the default explore set (must hand-copy the list — induced DRY violation) and the four-member AgentEvent union exports only three member interfaces.
    evidence: |
      // index.ts exports the options type whose doc points at the constant:
      //   exploreTools?: Iterable<string>;  /** Defaults to {@link DEFAULT_EXPLORE_TOOLS}. */
      // but DEFAULT_EXPLORE_TOOLS (exported by messages-to-events.ts:269) is absent from index.ts,
      // and package.json exports map only "." and "./renderer" — no deep-import escape hatch.
      // Likewise agent-event.ts exports at index.ts:70-76:
      export type { AgentEvent, AgentEventKind, AgentMessageEvent, AgentThinkingEvent, AgentToolEvent }
      // AgentExploredEvent (the new 4th union member) is missing — a consumer building or
      // narrowing explored events must resort to Extract<AgentEvent, { kind: "explored" }>.
    recommended_action: Re-export DEFAULT_EXPLORE_TOOLS and `export type { AgentExploredEvent }` from src/index.ts, and extend tests/export-surface.test.ts to pin both (the common extension case is `exploreTools: [...DEFAULT_EXPLORE_TOOLS, "my_read_tool"]`).

  - id: F-arch-5
    severity: LOW
    file: src/messages-to-events.ts
    line: 355
    summary: ToolResultFormatter's return type Pick<AgentToolEvent, "output" | "shell" | "diff"> statically permits multiple exclusive keys at once; a formatter returning e.g. { output, diff } only fails later at AgentTimeline's exclusivity throw, whose message does not name the formatter as the culprit.
    evidence: |
      export type ToolResultFormatter = (
        event: AgentToolEvent,
        rawResult: unknown,
      ) => Pick<AgentToolEvent, "output" | "shell" | "diff"> | undefined;
      // applyResultOverride spreads the body verbatim: return { ...rest, ...body };
      // The output|shell|diff invariant is documented ("EXCLUSIVE, so the override replaces all
      // three") but enforced only downstream by validateToolEvent, which reports
      // 'tool event "..." — provide only one of output | shell | diff' — no pointer to
      // formatToolResult as the source of the bad body.
    recommended_action: Type the return as a union of singletons ({ output: string } | { shell: ShellEnvelope } | { diff: string } | {} — the same shape routeToolResult already returns), or validate the key count inside applyResultOverride and throw a TypeError naming formatToolResult. Compile-time exclusivity is preferable (fail before run).

  - id: F-arch-6
    severity: LOW
    file: src/chat-message.tsx
    line: 58
    summary: The word-wrap fix hard-codes each ChatMessage row to the full terminal width (stdout.columns), coupling a leaf component to global stdout geometry — a ChatMessage embedded in a narrower parent column can now overflow its container instead of wrapping to it.
    evidence: |
      const { stdout } = useStdout();
      const rowWidth = stdout?.columns ?? 80;
      ...
      <Box {...margin} width={rowWidth}>
      // Yoga does not clamp a fixed-width child to its parent; a consumer composing ChatMessage
      // inside a half-width side panel gets a row sized to the FULL terminal. Pragmatic for the
      // dominant full-width chat surface (Ink has no container measurement), but it silently
      // changes layout semantics for embedded use.
    recommended_action: Accept the trade-off explicitly — document the full-terminal-width assumption in ChatMessageProps (or offer an optional `width` override prop) so embedded-layout consumers are not surprised. A follow-up could switch to Ink's measureElement on the parent when a bounded-width use case materializes (YAGNI until then).

  - id: F-arch-7
    severity: LOW
    file: src/chat-composer.tsx
    line: 443
    summary: The M54 onChange effect keys on [buffer.text, onChange]; a host passing an inline (unstable) callback gets the effect re-fired on every render with unchanged text, exceeding the documented "after mount and on each edit" contract.
    evidence: |
      // M54 — surface buffer text to the host (composer-empty precondition for backtrack).
      useEffect(() => {
        onChange?.(buffer.text);
      }, [buffer.text, onChange]);
      // Prop doc: "Fires after mount with the initial text and on each edit." With an inline
      // arrow the identity changes every render → redundant onChange calls with identical text.
      // No loop hazard (React bails out on same-value setState), but the host is invited to
      // debounce/compare defensively for a contract the library could keep itself.
    recommended_action: Track the last-notified text in a ref and call onChange only when buffer.text actually changed (keep onChange out of the trigger condition via the standard latest-callback ref pattern). One small hook, contract kept regardless of caller memoization discipline.

