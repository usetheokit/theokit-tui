    recommended_action: Add one composer scene to tests/public-api.integration.test.tsx importing ChatComposer from ../src/index.js (mount + typed text via stdin or placeholder render), or log an explicit deviation note; cheap fix, closes the declared-vs-done gap.
  - id: F-xval-2
    severity: MEDIUM
    file: docs/benchmarks/m1-chat-thread-baseline.json
    plan_ref: 'ADR D6 — "protocol/env identical to M0 (… pinned FORCE_COLOR)"; T4.1 AC "pnpm bench exits 0 and writes both mode aggregates"'
    summary: Committed M1 baseline was generated OUTSIDE the pinned-env runner — recorded color_env contradicts both ADR D6 and the file's own methodology string
    evidence: |
      m1-chat-thread-baseline.json line 10: "FORCE_COLOR": "unset"
      benchmarks/run.ts spawns every *.bench.tsx with env FORCE_COLOR: "1" — a run via `pnpm bench`
      cannot record "unset". M0 baseline (same protocol contract) records "FORCE_COLOR": "1".
      The M1 file's methodology string still claims "color env pinned by benchmarks/run.ts
      (FORCE_COLOR=1)" — internally inconsistent. Frame payload size (ANSI escapes) varies with
      color level, so the committed regression anchor is off-protocol relative to M0 and to future
      `pnpm bench` refreshes. Numbers are otherwise real, finite and self-consistent (schema test
      enforces), and the windowed-vs-plain conclusion (~64x) is robust to this delta.
    recommended_action: Regenerate the baseline via `pnpm bench` (pinned env) and commit the refresh, or add an ADR/CHANGELOG note accepting the unpinned run as the anchor and fix the methodology string.
  - id: F-xval-3
    severity: LOW
    file: benchmarks/chat-thread.bench.tsx
    plan_ref: 'T4.1 AC — "`pnpm bench --smoke` exits 0 in < 120s (CI-viable)"'
    summary: Smoke-time AC not reproduced — reviewer re-run exited 0 but took 202s wall
    evidence: |
      `time pnpm bench --smoke` → exit 0, 3m22.76s total at 61% CPU (reviewer machine under
      review-agent load; the run also includes the M0 chat-message bench via run.ts discovery).
      Plain-mode smoke alone contributes ~2×300 frames at ~130-190ms/frame ≈ 100s+.
      The <120s bound is plausibly met on idle CI but is unproven here; CI status itself was
      unverifiable from this environment (F-xval-8).
    recommended_action: Confirm the bench-smoke step duration on the develop CI run (node 20+22) and cite it as the AC evidence; if CI exceeds the budget, trim smoke workload (e.g., N_TOKENS for smoke).
  - id: F-xval-4
    severity: LOW
    file: src/chat-composer.tsx
    plan_ref: 'ADR D3 keymap — "backspace/delete delete"; Deep Dive "backspace/delete only"'
    summary: key.delete mapped to erase-BACKWARD (same as backspace) — documented in JSDoc and SEPA trail but not ratified by an ADR or CHANGELOG note
    evidence: |
      src/chat-composer.tsx:63-65 maps key.backspace || key.delete → delete-backward with the
      comment "ink maps the 0x7f byte to `delete` on most terminals; both erase back";
      JSDoc caveat at :125-127 states forward-delete is reducer-reachable but not key-bound at M1.
      The reducer's delete-forward op exists, is exported and unit-tested (plan D3 consequence held).
      The plan text is ambiguous ("backspace/delete delete"), so this reads as a documented
      interpretation, not a silent contradiction — but the review contract prefers an explicit
      ADR-grade record for keymap semantics of a public component.
    recommended_action: One-line ADR (or CHANGELOG § Added wording tweak) stating "Delete key erases backward at M1; forward-delete key binding deferred" so the decision survives outside code comments.
