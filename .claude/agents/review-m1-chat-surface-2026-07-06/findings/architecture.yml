findings:
  - id: F-arch-1
    severity: MEDIUM
    file: examples/chat.tsx
    line: 32
    plan_ref: T4.2 / ADR D8; Drawbacks row "dangling interval"
    summary: Single shared `timer.current` ref across overlapping streams — a second submit while a reply is streaming makes the first interval clear the WRONG handle (kills the in-flight second reply mid-stream) and leaks the first interval forever
    evidence: |
      ```tsx
      const timer = useRef<ReturnType<typeof setInterval> | undefined>(undefined);
      ...
      timer.current = setInterval(() => {          // line 42: overwrites any in-flight handle
        ...
        if (index >= tokens.length && timer.current !== undefined) {
          clearInterval(timer.current);            // line 54: clears whatever ref holds NOW,
          timer.current = undefined;               // not this stream's own interval
      ```
      Interactive repro: submit msg 1 → interval A (timer.current = A); submit msg 2
      before A completes → timer.current = B (handle A lost). When A's counter
      finishes, it calls clearInterval(B) — the second assistant reply freezes
      incomplete — then sets the ref undefined, so A itself is never cleared
      (unmount cleanup at line 62-68 checks timer.current, now undefined) and
      fires as a silent no-op every 60ms until process exit. The plan's risk
      mitigation ("clear interval on completion") only holds for the single
      scripted non-TTY stream; the TTY path — the demo's whole point — breaks it.
    recommended_action: Hold the interval handle in a per-stream closure variable inside `stream()` (each completion clears its OWN handle) and track live handles in a Set for the unmount cleanup; or guard `onSubmit` to ignore submits while a stream is in flight. State shared across concurrent operations must not live in one mutable ref.

  - id: F-arch-2
    severity: LOW
    file: src/chat-thread.tsx
    line: 23
    plan_ref: ADR D1 (frozen append-only prefix contract)
    summary: Prefix-shrink dynamics are unguarded and undocumented — increasing `windowSize`/`windowOverscan` at runtime (or removing messages) shrinks the Static items array below its watermark, so rows already printed to scrollback re-render live, visibly DUPLICATED in the terminal
    evidence: |
      ```tsx
      windowSize?: number;   // JSDoc documents graduation as FROZEN (ADR D1)
      ...
      const tailStart = Math.max(0,
        messages.length - Math.max(0, windowSize) - Math.max(0, windowOverscan));
      const prefix = useMemo(() => messages.slice(0, tailStart), [messages, tailStart]);
      ```
      Ink `<Static>` only renders items past its internal watermark (the contract
      the plan cites at references/ink/src/components/Static.tsx:21-58). Nothing
      throws or warns, so the silent-corruption class D7 guards against for
      duplicate ids has an unguarded sibling for window-prop dynamics. The JSDoc
      documents message graduation but not "window props must not grow / messages
      must not be removed once graduated".
    recommended_action: Extend the ChatThreadProps JSDoc contract with the constraint (window props stable-or-shrinking; graduated messages never removed), matching how D1's freeze is already documented and tested. A dev-time warn is optional; documentation is the minimum.

  - id: F-arch-3
    severity: LOW
    file: src/chat-composer.tsx
    line: 143
    plan_ref: ADR D3 (keymap)
    summary: The Shift+Enter-newline vs Enter-submit decision is encoded twice — the submit guard in the useInput handler and `newlineAction` must stay mutually consistent by hand (DRY on one keymap business rule)
    evidence: |
      ```tsx
      // handler (line 143):
      if (key.return && !(key.shift && multiLine)) { ...submit... return; }
      // newlineAction (line 52):
      const wantsNewline = input === "\n" || (key.return && key.shift);
      return multiLine && wantsNewline ? { type: "newline" } : undefined;
      ```
      Today the two predicates are complementary (a `key.return` event is
      submit XOR newline). But the knowledge "shift+return means newline when
      multiLine" lives in two places with different boolean shapes; editing one
      without the other makes Shift+Enter either submit AND insert or do
      neither, and the gap is untestable on legacy stdin (the /* v8 ignore */
      lines acknowledge the path is unexercisable in tests).
    recommended_action: Derive both branches from one predicate, e.g. `const isNewlineChord = multiLine && (input === "\n" || (key.return && key.shift))` computed once in the handler; submit becomes `key.return && !isNewlineChord`. Single source for the rule, same behavior.

  - id: F-arch-4
    severity: LOW
    file: src/text-buffer.ts
    line: 129
    plan_ref: ADR D3 ("Reducer is exported"); rules/error-handling.md § 2 (validate at the boundary)
    summary: "`textBufferReducer` is on the PUBLIC surface (src/index.ts:14) but performs no boundary validation of caller-supplied state — an out-of-range or mid-grapheme `cursorOffset` is accepted silently and can produce split-grapheme text"
    evidence: |
      ```ts
      function insertAt(state: TextBufferState, insertion: string): TextBufferState {
        const { text, cursorOffset } = state;
        return {
          text: text.slice(0, cursorOffset) + insertion + text.slice(cursorOffset),
          cursorOffset: cursorOffset + insertion.length,
        };
      }
      ```
      Internal use (ChatComposer's useReducer seeded with initialTextBuffer)
      always preserves the invariant, and the module honestly documents
      cursorOffset as a code-unit offset. But the public export makes external
      state a trust-boundary input: `{ text: "a👍", cursorOffset: 2 }` (mid
      surrogate pair) + insert yields corrupted text with no typed error —
      the same silent-corruption class D7 rejects in ChatThread. Degradation is
      crash-free but violates the fail-fast posture applied everywhere else in
      this slice.
    recommended_action: Either clamp/validate cursorOffset at the reducer entry (typed TypeError naming the offset, mirroring the D7 idiom) or narrow the public surface — if external consumers only need read-model types, stop re-exporting the reducer from src/index.ts until a validated API exists. Document the chosen contract in JSDoc either way.

