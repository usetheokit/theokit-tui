    file: docs/benchmarks/m1-chat-thread-baseline.json
    line: 10
    plan_ref: Global DoD § Benchmark proof + Final Phase AC ("pnpm bench — full run — refresh M1 baseline"); T4.1
    summary: Committed runtime-evidence artifact contradicts its own methodology — records FORCE_COLOR "unset" while claiming "color env pinned by benchmarks/run.ts (FORCE_COLOR=1)"; baseline was generated bypassing the pnpm bench runner
    evidence: |
      docs/benchmarks/m1-chat-thread-baseline.json:9-11 → "color_env": {"FORCE_COLOR": "unset"}.
      Same file line 105 (methodology) → "color env pinned by benchmarks/run.ts (FORCE_COLOR=1)".
      benchmarks/run.ts:26 pins FORCE_COLOR=1 and the pin predates the baseline commit
      (introduced in 04fb7e6, ancestor of a92c050) — therefore the committed baseline was
      produced by invoking the bench file directly (tsx benchmarks/chat-thread.bench.tsx),
      NOT via `pnpm bench` as the plan's Final Phase prescribes. Impact: (1) the artifact's
      methodology claim is false as recorded; (2) absolute ms/frame values were measured in a
      different color env than any future `pnpm bench` regression run, skewing baseline
      comparisons (ANSI payload changes frame-write cost); (3) the plain-vs-windowed RATIO is
      unaffected (both modes shared the env), so the M1 windowing conclusion stands.
      Provenance is otherwise honest: JSON timestamp 29s before commit a92c050, node v22.22.2
      matches, numbers self-consistent and magnitude-plausible.
    recommended_action: Regenerate the baseline via `pnpm bench` (so color_env records FORCE_COLOR=1) and commit the refresh; alternatively fix the methodology string to state the actual env. Consider asserting color_env.FORCE_COLOR === "1" in tests/bench-baseline.test.ts so a bypassed runner can never produce a green committed baseline again.
