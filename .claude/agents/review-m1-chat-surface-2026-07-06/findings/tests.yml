deviations_verified:
  - claim: "Ink drops intra-window burst frames — EC-3 asserted via onSubmit instead of lastFrame()"
    verdict: HONEST — empirically reproduced. Live probe against dist build (single stdin.write("hello
      world") + 50ms and +150ms settles) never surfaced the text in lastFrame(); onSubmit is the only
      reliable oracle. Char-by-char + 50ms settle matches the ink-ui test idiom (delay(50) in
      references/ink-ui/test/confirm-input.tsx). NOT gamed.
  - claim: "NO_COLOR subprocess needs explicit 20s timeout"
    verdict: HONEST — the test measured 8.7s under coverage instrumentation in this review's run;
      vitest's 5s default would flake. Timeout is scoped to the one subprocess test only.
  - claim: "v8-ignore for kitty-only shift encoding (chat-composer.tsx:51,142)"
    verdict: JUSTIFIED — ink 5.2.1 cannot decode kitty CSI-u shift+return without the terminal
      handshake, so key.shift+key.return is unsynthesizable via test stdin; the Ctrl+J newline path
      IS tested (ctrl_j_inserts_newline_in_multiline). Scope caveat: see F-tests-6.
  - claim: "v8-ignore for defensive fall-through (text-buffer.ts:49-50)"
    verdict: JUSTIFIED — verified all three callers (graphemeAt, deleteForward, moveRight) guard
      offset >= text.length before calling nextBoundary, and for offset < length the last segment's
      end === text.length > offset always returns inside the loop. Genuinely unreachable via the API.
