    domain_anchor: "knowledge-base/references/ink/test/hooks-use-input.tsx (uses explicit \\u escapes: '\\u0008', '\\u001B\\u007F')"
    summary: "Byte constants mix styles: RIGHT_ARROW uses the explicit escape \"\\u001B[C\" while LEFT_ARROW embeds a RAW 0x1B byte and BACKSPACE a RAW 0x7F byte (both invisible in any editor/diff — od-verified correct today). Invisible control bytes in source are exactly the 'prose rendering' corruption hazard the file's own comment warns about: one well-meaning editor/formatter/copy-paste pass can strip them without any visible diff, and the failure mode is a confusing downstream test failure. ink's own suite writes these as explicit escapes."
