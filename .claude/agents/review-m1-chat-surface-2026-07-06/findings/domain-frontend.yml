  - id: F-dom-3
    severity: LOW
    file: src/chat-thread.tsx
    line: 22
    plan_ref: "ADR D1 — frozen append-only prefix contract, documented in JSDoc"
    domain_anchor: "references/ink/src/components/Static.tsx:31-39 — index watermark follows items.length both directions"
    summary: "JSDoc documents the frozen prefix but not the dynamic-window hazard: INCREASING windowSize/windowOverscan at runtime shrinks the prefix, so already-emitted scrollback rows re-appear in the live tail (visible duplication); shrinking again re-emits them into scrollback a second time (Static's setIndex(items.length) lowers the watermark)"
    evidence: |
      ```tsx
      const tailStart = Math.max(0, messages.length - Math.max(0, windowSize) - Math.max(0, windowOverscan));
      const prefix = useMemo(() => messages.slice(0, tailStart), [messages, tailStart]);
      ```
      Verified in the ink source: `useLayoutEffect(() => { setIndex(items.length); }, [items.length])`
      lowers the watermark when items shrink, so a later growth re-renders rows already in
      scrollback. Static output is unerasable, so duplication is permanent.
    recommended_action: "Extend the windowSize/windowOverscan JSDoc: props are tuning knobs to set at mount; increasing them after messages have graduated duplicates history. Optionally clamp tailStart to be monotonically non-increasing via a ref in a later milestone."
