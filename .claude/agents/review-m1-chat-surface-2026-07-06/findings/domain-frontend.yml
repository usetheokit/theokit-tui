findings:
  - id: F-dom-1
    severity: MEDIUM
    file: examples/chat.tsx
    line: 42
    plan_ref: "Drawbacks & Risks — 'Example with fake streaming timer could leave a dangling interval on exit' (mitigation: clear interval on completion)"
    domain_anchor: "ADR D8 (example is the wiring caller) + rules/error-handling.md § 1 (silent failure class)"
    summary: "Re-entrant submit leaks the old interval forever AND freezes the new streaming reply: useFakeStreaming shares one timer.current ref across concurrent stream() calls"
    evidence: |
      ```tsx
      timer.current = setInterval(() => {        // stream B overwrites stream A's id
        ...
        if (index >= tokens.length && timer.current !== undefined) {
          clearInterval(timer.current);          // stream A, on finishing, clears stream B's interval
          timer.current = undefined;
        }
      }, 60);
      ```
      Trace: user submits while a reply is streaming -> stream B overwrites timer.current;
      when interval A's index reaches tokens.length it calls clearInterval(timer.current)
      which is interval B -> B's reply freezes mid-stream; interval A itself is never
      cleared (its guard is now false forever) -> 60ms no-op tick leaks until process exit.
      Interactive path only (non-TTY scripted mode streams exactly once), but the example
      is the flagship consumer program consumers copy, and the plan's risk-table mitigation
      ("clear interval on completion") does not hold under this sequence.
    recommended_action: "Capture the interval id in a local const inside stream() and clear THAT id in the tick; or early-clear any in-flight interval at the top of stream(). Keep timer.current only for the unmount cleanup (or track a Set of ids)."
