    summary: "Verified honest trade-off, no action at M1: ink 5.2.1 reports the common 0x7f Backspace byte as key.delete, so mapping key.delete to delete-backward is REQUIRED for backspace to work; the side effect is that the forward Delete key (ESC[3~, also key.delete) erases backward even though the reducer's delete-forward op exists. JSDoc documents this. Flag for the ink 6 migration: upstream plans to split backspace/delete, at which point key.delete should be rebound to delete-forward"
