findings:
  - id: F-dom-1
    severity: MEDIUM
    file: benchmarks/chat-message.bench.tsx
    line: 148
    plan_ref: ADR D6/D9 — benchmark baseline is the milestone's runtime-evidence artifact; M1+ regress against the committed JSON
    domain_anchor: plan ADR D2 (determinism root — color-detection inputs pinned) applied to tests but NOT to the bench harness
    summary: Bench color environment is unpinned ("FORCE_COLOR inherited from the invoking shell" per the methodology field) — frame payload size (ANSI vs plain) varies with TTY/CI/shell, so M1 regression comparisons against this baseline can be skewed by environment, not code
    evidence: |
      benchmarks/chat-message.bench.tsx methodology string:
        "FORCE_COLOR inherited from the invoking shell"
      benchmarks/run.ts spawnSync has no env pin:
        spawnSync("pnpm", ["exec", "tsx", join(benchDir, file), ...args], { stdio: "inherit" })
      Contrast with vitest.config.ts, which pins FORCE_COLOR=1/NO_COLOR=""/CI="" precisely
      because unpinned color detection is nondeterministic (ADR D2 / EC-5). The same class
      of nondeterminism is left open in the harness whose output is the committed baseline.
      Honesty credit: the methodology field discloses it (Rule 3 respected) — but disclosure
      does not make future same-machine/different-shell comparisons apples-to-apples
      (e.g., `pnpm bench` in a TTY vs `pnpm bench | tee` vs CI where CI=true flips supports-color).
    recommended_action: Pin the color env in benchmarks/run.ts spawn (e.g., env {...process.env, FORCE_COLOR "1", NO_COLOR ""}) and record the pinned value in the baseline JSON (e.g., env.force_color field); regenerate the baseline once. Small change, closes the only unpinned determinism input in the measurement chain.

  - id: F-dom-2
    severity: LOW
    file: tests/bench-baseline.test.ts
    line: 39
    plan_ref: T3.1 TDD — benchmark_baseline_json_exists_with_statistical_protocol (EC-2 Number.isFinite oracle)
    domain_anchor: rules/analysis-golden-rule.md § 3 (statistical rigor) + ADR D9 (data-only baseline)
    summary: Schema test validates shape honestly (Number.isFinite per EC-2 — correctly implemented) but cannot detect a stale or hand-edited baseline — aggregate is not cross-checked against runs, and finite-but-impossible values (negative std_dev, mean outside run range) pass
    evidence: |
      The test asserts Number.isFinite on every aggregate field (EC-2 oracle: honest, NaN
      is typeof number — good) and runs.length === protocol.measured_runs (good), but:
        expect(Number.isFinite(baseline.aggregate.mean_ms_per_frame.std_dev)).toBe(true)
      accepts std_dev: -5 or mean: 9999 while runs say ~11.7. Nothing recomputes
      aggregate from runs; a corrupted-but-finite committed JSON stays green forever.
    recommended_action: "Strengthen cheaply: recompute mean of runs[].mean_ms_per_frame in the test and assert |recomputed − aggregate.mean| < epsilon; assert std_dev >= 0. Keeps the data-only posture (ADR D9) while making the committed artifact self-consistent."

  - id: F-dom-3
    severity: LOW
    file: vitest.config.ts
    line: 11
    plan_ref: T0.2 Files-to-edit — 'env pins FORCE_COLOR="1" + NO_COLOR="" + CI="" (EC-5)'
    domain_anchor: no-color.org spec ("present and not an empty string") vs looser presence-only implementations
    summary: NO_COLOR "" and CI "" make the variables PRESENT (empty) in worker process.env — libraries that check mere presence of NO_COLOR (older/looser implementations of the spec) would disable color despite FORCE_COLOR; today supports-color gives FORCE_COLOR precedence and the canary test proves it, so risk is latent, not active
    evidence: |
      vitest.config.ts:
        env: { FORCE_COLOR: "1", NO_COLOR: "", CI: "" }
      Setting env.NO_COLOR = "" means ("NO_COLOR" in process.env) === true in every worker.
      Mitigations already in the tree (why this is LOW, not MEDIUM):
        1. src/chat-message.test.tsx forced_color_canary_ansi_escapes_present asserts
           "[" in a rendered frame — any dependency-upgrade regression of the pin
           fails loudly. Exemplary defense.
        2. CI="" cannot break vitest's own CI snapshot strictness on GitHub Actions:
           test.env applies inside workers, and std-env isCI also reads GITHUB_ACTIONS,
           which is untouched — missing snapshots still fail (not silently created) in CI.
    recommended_action: Keep as-is (the canary is the real guard) but add a one-line comment noting NO_COLOR=""/CI="" relies on the modern "non-empty" reading of the spec + FORCE_COLOR precedence, so a future upgrade that flips the canary red is diagnosable in seconds.

  - id: F-dom-4
    severity: LOW
    file: src/theme.tsx
    line: 65
    plan_ref: T1.1 (theme stub) — plan mandated boundary validation only for ChatMessage.role (EC-1 MUST FIX)
    domain_anchor: rules/error-handling.md § 2 (validate at the boundary) + rules/testing.md § 4.1 (negative lens)
    summary: Negative-lens asymmetry — ChatMessage.role has an exemplary negative case (typed TypeError + exact message asserted) but TheoTUIProvider's theme prop has zero negative cases; a JS consumer passing a malformed override (e.g., theme={{ role: "cyan" }}) is silently spread by mergeTheme into a corrupt token object that fails later, far from the boundary
    evidence: |
      src/theme.test.tsx covers the edge lens thoroughly (empty override {}, missing prop,
      partial leaf override — EC-4 all green) but contains no invalid-input case.
      mergeTheme spreads unvalidated input:
        user: { ...defaultTheme.role.user, ...override.role?.user }
      With override.role = "cyan" (a JS caller mistake TS cannot stop), spreading a string
      yields index-keyed garbage; the failure surfaces later inside ChatMessage rendering,
      not at the provider boundary — the exact anti-pattern § 4.1 negative cases exist to catch.
      HONEST CAVEAT: the plan deliberately scoped runtime validation to EC-1 (role guard)
      only, so this is plan-consistent — flagged per anti-pattern rule 5 (the plan can have
      domain gaps too). Advisory for M1/M6 theme work, not a merge blocker for M0.
    recommended_action: When M6 (or M1) touches the theme system, add a negative case asserting a typed error (or documented lenient behavior) for structurally-invalid theme overrides, mirroring the EC-1 pattern.

  - id: F-dom-5
    severity: LOW
    file: .github/workflows/ci.yml
    line: 40
    plan_ref: Global DoD — "Coverage >= 90% on src/** — pnpm test -- --coverage"; T4.1 CI steps (five gates + bench smoke only)
    domain_anchor: rules/testing.md § 1 (a broken/red gate that nobody runs loses all value)
    summary: The 90% coverage thresholds configured in vitest.config.ts are enforced ONLY when --coverage is passed; CI runs plain `pnpm test` and `pnpm gates` omits coverage too, so a future coverage regression cannot fail any automated gate — the threshold exists but nothing exercises it continuously
    evidence: |
      vitest.config.ts declares coverage.thresholds { statements/branches/functions/lines: 90 }.
      package.json: "test": "vitest run" (no coverage); "gates" chain omits test:coverage.
      ci.yml test step: run: pnpm test
      The threshold was exercised once at Final Phase validation (commit 1b5503a mentions the
      coverage gate) but is unwired from the recurring chain. Plan-consistent (ROADMAP M0 DoD
      names exactly five gates), hence LOW — but a threshold no gate runs is decorative.
    recommended_action: Add `pnpm test:coverage` as a CI step (or fold into `gates`) in M1 so the 90% floor is continuously enforced rather than one-shot.

  - id: F-dom-6
    severity: INFO
    file: src/chat-message.test.tsx
    line: 67
    plan_ref: T2.1 TDD — invalid_role_throws_typed_error_with_clear_message (EC-1)
    domain_anchor: rules/testing.md § 4 (test behavior, not implementation)
    summary: The EC-1 negative case invokes ChatMessage as a plain function (bypassing the React/Ink render path) — valid because the guard is the first statement before any hook (SEPA resolution 1), but the render-path failure surface (how Ink reports the throw to a real consumer) is unasserted; slightly implementation-coupled (assumes guard-precedes-hooks ordering)
    evidence: |
      expect(() => ChatMessage({ role: "system", children: "x" })).toThrow(TypeError)
      Direct invocation is the pragmatic way to assert the typed error + exact message
      (renderFrame would swallow it into Ink's error frame). The exact-message assertion
      ('ChatMessage: invalid role "system" — expected "user" | "assistant"') is exemplary
      § 4.1 negative-case discipline. Note only: if the guard ever moves below a hook,
      this test starts violating Rules of Hooks silently instead of failing clearly.
    recommended_action: None required at M0. Optionally add a comment in the test warning that the direct-invocation style depends on the guard staying hook-free.

positive_observations:
  - "Snapshot determinism strategy is textbook: config-root env pin (FORCE_COLOR/NO_COLOR/CI, vitest.config.ts:9-13), Box width={40} on both snapshots, single renderFrame determinism point shared by ALL render tests (src + tests), and a canary test that converts a silent env-pin regression into a red test. Committed .snap contains stable level-1 ANSI ([36m/[35m) matching FORCE_COLOR=1."
  - "NO_COLOR probe design is correct where the naive approach would be dishonest: tests/fixtures/no-color-probe.tsx runs in a FRESH subprocess with a minimal env (PATH+HOME+NO_COLOR=1) because chalk fixes its color level at module load — an in-process stubEnv test would pass vacuously. The stripped env also prevents the vitest worker's FORCE_COLOR=1 from leaking into the child. Assertions cover both absence of ESC and presence of visible text."
  - "Benchmark honesty holds end-to-end: Number.isFinite oracle (EC-2) actually implemented on every aggregate AND per-run metric; zero-frame guard exits 1 before serializing NaN; methodology string discloses the heuristic's limits (tick overhead, evenly-distributed wall time); committed baseline contains real, plausible numbers (5 runs, std_dev 0.335/2.713) with hardware+node metadata per analysis-golden-rule § 3; smoke mode never writes the file (ADR D9 respected)."
  - "Pyramid balance is healthy for a walking skeleton (rules/testing.md § 2): 16 unit tests (theme 5 + chat-message 11), 9 boundary/contract tests (public-api integration 2, package-manifest 3, export-surface 3, bench schema 1), CI as the E2E layer. § 4.1 dual lens present: edge cases (empty children, empty override {}, provider without prop, 120-char wrap in 20-col box) AND a negative case asserting the specific typed error and exact message — not merely 'it throws'. passWithNoTests: false closes the silent-empty-suite hole."
verdict_contribution: NO BLOCKER/HIGH findings from the testing domain — 1 MEDIUM (bench env pin) with documented mitigation path, 4 LOW advisory, 1 INFO.
