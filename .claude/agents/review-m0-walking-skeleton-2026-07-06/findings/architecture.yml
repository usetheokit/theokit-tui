findings:
  - id: F-arch-1
    severity: MEDIUM
    file: src/theme.tsx
    line: 73
    plan_ref: T1.1 (ADR D5 theme stub); Baseline Context § Architecture boundaries
    summary: Context value re-created on every provider render — mergeTheme(theme) inline in JSX defeats consumer memoization (canonical React context pitfall)
    evidence: |
      ```tsx
      <ThemeContext.Provider value={mergeTheme(theme)}>
      ```
      Every re-render of TheoTUIProvider's parent produces a fresh merged object even when
      `theme` is unchanged, so every useTheoTheme() consumer re-renders regardless of any
      React.memo bailout on their props. In the library's core streaming use case (provider
      parent re-renders per token — exactly the benchmark workload in
      benchmarks/chat-message.bench.tsx:58-74), this inflates render work and bakes the
      overhead into the committed M0 baseline that M1+ will regress against.
    recommended_action: Wrap the merged theme in useMemo(() => mergeTheme(theme), [theme]) inside TheoTUIProvider. One-line fix, no API change; re-run pnpm bench to refresh the baseline if applied.
  - id: F-arch-2
    severity: MEDIUM
    file: src/chat-message.test.tsx
    line: 108
    plan_ref: T2.1 TDD line "no_color_render_contains_text_without_ansi_escapes"
    summary: Documented deviation from the plan's declared NO_COLOR strategy — plan mandates "spawn-free vitest.stubEnv" but the test spawns a pnpm/tsx subprocess with a fixture
    evidence: |
      Plan T2.1 TDD: "no_color_render_contains_text_without_ansi_escapes() — spawn-free:
      re-render with vitest.stubEnv NO_COLOR=1 + FORCE_COLOR unset".
      Implementation:
      ```ts
      const out = execFileSync(
        "pnpm",
        ["exec", "tsx", "tests/fixtures/no-color-probe.tsx"],
        { encoding: "utf8", env: { PATH: ..., HOME: ..., NO_COLOR: "1" } },
      );
      ```
      The technical justification in the code comment is sound (chalk pins its color level
      at module load; in-process stubEnv genuinely cannot degrade it — the plan's declared
      mechanism was unimplementable). However, per cycle-implement.md § Anti-patterns
      ("Editing the plan during implementation. If the plan was wrong, return to /to-plan"),
      the plan text still asserts the spawn-free contract; the deviation lives only in code
      comments + SEPA logs. Side effects of the chosen mechanism: a per-test process spawn
      (slow, needs pnpm on PATH; env stripped to PATH/HOME) and POSIX-only invocation
      ("pnpm" would not resolve on Windows without shell:true) — acceptable for the
      linux-only dev/CI matrix but undeclared.
    recommended_action: Record the deviation formally — a one-paragraph amendment note in the plan (or the implementation summary consumed by /release) stating stubEnv was unimplementable and the subprocess fixture supersedes it, so cross-validation does not re-flag it and M1+ authors do not re-attempt stubEnv.
  - id: F-arch-3
