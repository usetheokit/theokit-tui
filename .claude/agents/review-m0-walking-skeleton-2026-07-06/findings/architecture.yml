      asserts its absence — so a future edit pointing "main" at a stale/wrong path passes
      the contract test while breaking legacy resolvers.
    recommended_action: Either remove the redundant top-level "main"/"types" (exports map covers modern Node + TS moduleResolution bundler/node16) or add assertions for them in tests/package-manifest.test.ts so every published field is contract-covered.
