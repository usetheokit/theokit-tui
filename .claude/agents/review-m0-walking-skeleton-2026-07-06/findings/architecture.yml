  - id: F-arch-6
    severity: LOW
    file: src/theme.tsx
    line: 49
    plan_ref: T1.1 Deep Dives (merge invariants); ADR D5
    summary: Nested-provider semantics compose against defaultTheme, not the enclosing provider's theme — inner overrides silently discard outer customizations
    evidence: |
      ```ts
      function mergeTheme(override: TheoThemeOverride | undefined): TheoTheme {
        if (override === undefined) { return defaultTheme; }
        return { role: { user: { ...defaultTheme.role.user, ...override.role?.user }, ...
      ```
      mergeTheme always merges over defaultTheme; it never reads the surrounding
      ThemeContext. <TheoTUIProvider A><TheoTUIProvider B> yields default+B, not A+B.
      The plan is silent on nesting (single-provider shape at M0 — YAGNI defensible), but
      the M0 token names/behavior "become API" per ADR D5's consequences, so the
      composition semantics should be a deliberate, documented choice rather than an
      accident of the helper.
    recommended_action: One-line doc note on TheoTUIProvider ("nesting replaces, does not compose — composition arrives with the M6 theme system") or read useContext(ThemeContext) as the merge base. No code change required for M0 if documented.
  - id: F-arch-7
    severity: LOW
    file: src/chat-message.test.tsx
    line: 64
    plan_ref: T2.1 TDD "invalid_role_throws_typed_error_with_clear_message" (EC-1)
    summary: Negative-case test invokes ChatMessage() as a plain function, coupling the test to the guard-before-hook statement ordering inside the component
    evidence: |
      ```ts
      expect(() =>
        ChatMessage({
          // @ts-expect-error — deliberately invalid role (EC-1 negative case)
          role: "system", children: "x",
        }),
      ).toThrow(TypeError);
      ```
      Direct invocation only works because the role guard precedes useTheoTheme(). If the
      guard ever moves after the hook, useContext outside a renderer also throws a
      TypeError, so the first assertion keeps passing for the wrong reason (the message
      assertion at :74-82 is what actually protects the contract). Testing a component via
      plain call also bypasses React's render semantics — a render-path negative test
      (render + expect throw, or console.error capture) exercises the real boundary.
    recommended_action: Keep the message-content assertion as primary; optionally re-shape the negative case to assert through renderFrame with an error boundary or documented try/catch so the test survives internal reordering. Advisory — current double assertion is adequate for M0.
