      surfaces to a real consumer inside an Ink render tree is never exercised.
    recommended_action: Keep the direct-call assertion for message content, add one render-path case (e.g., renderFrame with invalid role + assert rejection/throw) so the consumer-visible failure mode is pinned; or document the gap as accepted in the implementation log.
