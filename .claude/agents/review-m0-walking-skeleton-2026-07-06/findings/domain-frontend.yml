findings:
  - id: F-dom-1
    severity: MEDIUM
    file: src/theme.tsx
    line: 73
    plan_ref: "ADR D5 — theme stub: flat semantic tokens via provider; plan Deep Dive locks merge-over-defaultTheme but says nothing about context value identity"
    domain_anchor: "Canonical React provider pattern (context value must be referentially stable); peer evidence: references/ink-ui/source/theme.tsx:53-57 passes a caller-stable `theme` object, never constructs one inline"
    summary: "ThemeContext value is `mergeTheme(theme)` computed inline in JSX — a fresh object identity on EVERY provider render, so every context consumer re-renders even when the theme is unchanged, and React.memo on future primitives is defeated"
    evidence: |
      ```tsx
      return (
        <ThemeContext.Provider value={mergeTheme(theme)}>
          {children}
        </ThemeContext.Provider>
      );
      ```
      The project's own north-star workload is streaming re-renders (benchmark: 300
      sequential rerenders under one provider). At M0 with one component the cost is
      invisible; from M1+ (ChatThread with N messages) every token append re-renders
      every themed descendant via context, not just via parent-child props.
    recommended_action: "`const value = useMemo(() => mergeTheme(theme), [theme]);` — one line, closes the canonical provider anti-pattern before consumers exist. Note honestly: callers passing inline object literals still defeat it, but the default/no-theme and stable-theme paths (the common cases, incl. the benchmark) become stable."

  - id: F-dom-2
    severity: MEDIUM
    file: eslint.config.js
    line: 8
    plan_ref: "ADR D7 — eslint 9 flat + typescript-eslint recommended (no React-specific plugins declared)"
    domain_anchor: "Domain recipe 'frontend-react': verify hooks discipline (no conditional hook calls). eslint-plugin-react-hooks is the only mechanized enforcement of rules-of-hooks"
    summary: "A React component library ships with zero React-aware lint: no eslint-plugin-react-hooks (rules-of-hooks / exhaustive-deps) and no eslint-plugin-react. The codebase already contains the exact shape the rule polices: ChatMessage conditionally throws BEFORE calling useTheoTheme (src/chat-message.tsx:20-25), i.e. the hook is not reached on every code path"
    evidence: |
      ```js
      export default tseslint.config(
        { ignores: [...] },
        eslint.configs.recommended,
        ...tseslint.configs.recommended,   // <-- no react-hooks plugin anywhere
        { rules: { complexity: ["error", 10] } },
      );
      ```
      ```tsx
      // src/chat-message.tsx:20-25 — guard-throw before the hook
      if (role !== "user" && role !== "assistant") {
        throw new TypeError(...);
      }
      const tokens = useTheoTheme().role[role];
      ```
      Today the throw-before-hook is safe in practice (a throwing component never
      commits, so hook order can't skew between renders), and it is plan-mandated
      (EC-1 boundary validation). But nothing stops M1+ contributions from adding a
      genuinely unsafe conditional hook — the gate chain would stay green.
    recommended_action: "Add eslint-plugin-react-hooks (recommended config) to eslint.config.js. If it then flags the EC-1 guard as a conditional hook call, resolve by moving the guard AFTER the hook call (useTheoTheme is side-effect-free and total) or by an inline disable with a comment citing plan EC-1 — either keeps fail-fast semantics. Small config change; fits M0 or first M1 task."

  - id: F-dom-3
    severity: LOW
    file: src/theme.tsx
    line: 49
    plan_ref: "ADR D5 + T1.1 Deep Dive — 'merges over defaultTheme (shallow per top-level group)'; nested-provider semantics never specified"
    domain_anchor: "React theming convention (nested providers compose with the ancestor theme); peer check: references/ink-ui/source/theme.tsx:53-61 also does NOT compose (merge is external via extendTheme), so this is a divergence from web-React convention, not from the Ink peer"
    summary: "mergeTheme always merges the override over the static defaultTheme, never over the ancestor provider's theme — a nested <TheoTUIProvider theme={...}> silently DISCARDS all outer-provider overrides. Implementation matches the plan, but the behavior is implicit: undocumented and untested, and D5's consequence ('M0 token names become API') means this semantic hardens too"
    evidence: |
      ```tsx
      function mergeTheme(override: TheoThemeOverride | undefined): TheoTheme {
        if (override === undefined) {
          return defaultTheme;          // <-- base is always defaultTheme,
        }                               //     never useContext(ThemeContext)
        return { role: { user: { ...defaultTheme.role.user, ...override.role?.user }, ...
      ```
    recommended_action: "M0-scope: add one sentence to the TheoTUIProvider JSDoc ('nested providers reset to defaultTheme + own override; they do not compose with ancestors') plus one test pinning that behavior. Composing with the parent (read ThemeContext inside the provider) is a deliberate M6 decision — record it, don't ship it silently."

  - id: F-dom-4
    severity: LOW
    file: src/theme.tsx
    line: 39
    plan_ref: "T1.1 Invariants — 'useTheoTheme() NEVER returns undefined (fallback to defaultTheme — fail-safe default)'"
    domain_anchor: "Shared-singleton mutability: mergeTheme spreads FROM defaultTheme, so any consumer mutation of the exported object corrupts every subsequent merge and every unprovided render, library-wide"
    summary: "defaultTheme is exported as a plain mutable object; `defaultTheme.role.user.glyph = 'X'` in consumer code (or a future test) silently rewrites the fail-safe base for the whole process. Types are not Readonly and the object is not frozen"
    evidence: |
      ```tsx
      export const defaultTheme: TheoTheme = {
        role: { user: { glyph: "> ", prefix: "cyan", text: undefined }, ... },
        status: { error: "red", success: "green", warning: "yellow" },
      };
      ```
    recommended_action: "Deep-freeze the export (three Object.freeze calls or a 5-line freeze helper) and/or type the export as a Readonly structure. Zero runtime cost, protects the invariant the plan calls fail-safe."

  - id: F-dom-5
    severity: LOW
    file: src/index.ts
    line: 1
    plan_ref: "T0.2 — 'src/index.ts exporting VERSION' (placeholder \"0.0.0\" until T1/T2 add exports); no task ever ties it to package.json"
    domain_anchor: "Public API ergonomics — an exported VERSION that lies is worse than none; cycle-release bumps package.json but nothing bumps this constant"
    summary: "VERSION is hardcoded '0.0.0' and is public API (exported from the composition root), but no test or build step syncs it with package.json — first /release will ship a package whose manifest says 0.1.0 while its runtime constant says 0.0.0"
    evidence: |
      ```ts
