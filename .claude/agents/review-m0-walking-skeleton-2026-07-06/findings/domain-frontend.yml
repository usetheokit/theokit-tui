    recommended_action: "Either extend tests/package-manifest.test.ts (or export-surface test) to assert VERSION === JSON.parse(readFileSync('package.json')).version, or drop the export until a release process needs it (YAGNI). Flag to the release cycle either way."

  - id: F-dom-6
    severity: INFO
    file: src/theme.tsx
    line: 42
    plan_ref: "ADR D4 — glyph prefixes borrowed from gemini-cli (UserMessage.tsx:26 '> ', GeminiMessage.tsx:28 '✦ ')"
    domain_anchor: "Terminal-adaptive rendering: U+2726 (✦ BLACK FOUR POINTED STAR) has East Asian Width = Ambiguous — renders 2 cells wide on ambiguous-wide CJK terminal configs while Ink's string-width counts 1, producing column misalignment; legacy non-UTF8 consoles show mojibake"
    summary: "The default assistant glyph is an EAW-Ambiguous Unicode char; on a minority of terminal configurations alignment/rendering degrades. Honest assessment: gemini-cli ships the same glyph in production, the theme override is a working escape hatch, and M6 owns terminal-adaptive theming — recording so M6 inherits it deliberately"
    evidence: |
      ```tsx
      assistant: { glyph: "✦ ", prefix: "magenta", text: undefined },
      ```
    recommended_action: "No M0 change. Add to the M6 (terminal-adaptive) backlog: consider an ASCII fallback token set (e.g. '*' / '>') selected when the terminal reports limited capability. I have NOT verified specific terminal emulators' behavior — flagging for a human/M6 spike, not asserting breakage."

