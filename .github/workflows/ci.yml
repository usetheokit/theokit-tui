# M0 gate chain (plan T4.1): each gate is its own step so CI reports exactly
# which stage failed (ADR D7 — observable exit codes, fail-fast fail-clear).
# Node matrix proves the engines floor (22, ink7 requires node>=22) and the forward leg (24).
name: ci

on:
  push:
    # `main` was missing, and the gap is visible in the run history: across the last twenty runs
    # this workflow fired on develop and on pull requests, and never once on main. A merge could
    # land on the release branch with no CI record of what it passed.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict,
  # which reads the same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.12', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — the never-weaken guard diffs against the M10 base SHA

      # The install spine — Node, the package manager this repository DECLARES, a cache keyed
      # so it cannot outlive that manager, and a frozen install. Shared because it was the
      # same four steps in nine repositories, and because the knowledge inside them was not:
      # theokit-sdk pinned pnpm 9.15.0 in four workflows while its manifest said 10.34.1, so
      # every gate there validated a tree no contributor had (usetheokit/theokit-sdk#415).
      #
      # @v1 is a moving major and the blanket SHA-pinning policy is suppressed for it: that
      # policy defends against a THIRD PARTY moving a ref under us, and this is the same
      # organisation. What a SHA would buy is a guarantee we already have; what it would cost
      # is one correction becoming nine pull requests. What the action RUNS stays pinned —
      # every action inside it by digest, and the package manager by this repository's manifest.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          node-version: ${{ matrix.node-version }}

      - name: format
        run: pnpm format:check

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      # B-122 — build BEFORE test. `dist/` is gitignored, and `publint --strict`
      # (via tests/package-contract.test.ts) resolves every `exports` entry against
      # the built artifact. With the old order it reported EVERY entry as missing,
      # including `.` and `./renderer`, so this job had been red on `develop` for at
      # least 8 consecutive runs — long enough that a real regression would have
      # arrived looking exactly like the standing noise.
      - name: build
        run: pnpm build

      # B-079 — the duplicate is DELIBERATE, and this comment is the reason recorded where the
      # duplication is, because the next person to notice the cost will be reading this file.
      #
      # `test` and `coverage` execute the same 1700+ assertions, twice per matrix leg, four times
      # per push. An item was filed to remove `test` as redundant. It was refuted by its own
      # acceptance criterion, which asked whether instrumentation changes the timing profile enough
      # to matter for a suite already measured to be timing-sensitive (B-058).
      #
      # It does. Measured 2026-08-20 on the 0.72.0 release-to-main PR: this job went red in the
      # `coverage` step ONLY, with `test` green in the same job on the same commit. The defect was
      # real (B-097): a test waited one macrotask for an async re-render, and under coverage
      # instrumentation that flush did not fit in the tick.
      #
      #     pnpm test           37456ms  41987ms
      #     pnpm test:coverage  50861ms  43860ms
      #
      # Overlapping ranges — not "coverage is slower by X", but the weaker and sufficient claim
      # that the two have DIFFERENT timing distributions. A timing-sensitive suite run under two
      # distributions is two experiments, not one repeated twice.
      #
      # So removing `test` would remove a distinct experiment, not a redundant one. If the ~301s
      # median ever has to come down, cut it somewhere that is not buying a second timing profile.
      - name: test
        run: pnpm test

      - name: coverage
        run: pnpm test:coverage

      - name: bench smoke
        run: pnpm bench --smoke

      # B-126 — SonarCloud, analysed from CI rather than by Automatic Analysis.
      #
      # Automatic Analysis failed on every pull request here (#70, #71, #72 carry the identical
      # "The last analysis has failed" comment) while the sibling `theokit-sdk` passes on the same
      # mechanism — so the difference is in that project's server-side settings, which are not
      # readable from a repository. Reporting from CI supersedes it.
      #
      # Runs once (node 22) rather than per matrix leg: the analysis is of the source, and two
      # identical scans would race for the same server-side report.
      #
      # SKIPS LOUDLY when the token is absent, instead of failing or pretending. `SONAR_TOKEN` is
      # created in SonarCloud and added by the repository owner; until then the step says so in the
      # log rather than leaving a red check whose cause nobody can read.
      - name: sonarcloud
        if: matrix.node-version == '22.x'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::notice title=SonarCloud::SONAR_TOKEN is not set — analysis skipped."
            echo "Add it in Settings > Secrets > Actions to replace the failing Automatic Analysis (B-126)."
            exit 0
          fi
          npx --yes sonarqube-scanner@4
