# M0 gate chain (plan T4.1): each gate is its own step so CI reports exactly
# which stage failed (ADR D7 — observable exit codes, fail-fast fail-clear).
# Node matrix proves the engines floor (22, ink7 requires node>=22) and the forward leg (24).
name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the never-weaken guard diffs against the M10 base SHA

      - uses: pnpm/action-setup@v4
        # pnpm version resolved from package.json "packageManager" (corepack).

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: format
        run: pnpm format:check

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      # B-122 — build BEFORE test. `dist/` is gitignored, and `publint --strict`
      # (via tests/package-contract.test.ts) resolves every `exports` entry against
      # the built artifact. With the old order it reported EVERY entry as missing,
      # including `.` and `./renderer`, so this job had been red on `develop` for at
      # least 8 consecutive runs — long enough that a real regression would have
      # arrived looking exactly like the standing noise.
      - name: build
        run: pnpm build

      - name: test
        run: pnpm test

      - name: coverage
        run: pnpm test:coverage

      - name: bench smoke
        run: pnpm bench --smoke

      # B-126 — SonarCloud, analysed from CI rather than by Automatic Analysis.
      #
      # Automatic Analysis failed on every pull request here (#70, #71, #72 carry the identical
      # "The last analysis has failed" comment) while the sibling `theokit-sdk` passes on the same
      # mechanism — so the difference is in that project's server-side settings, which are not
      # readable from a repository. Reporting from CI supersedes it.
      #
      # Runs once (node 22) rather than per matrix leg: the analysis is of the source, and two
      # identical scans would race for the same server-side report.
      #
      # SKIPS LOUDLY when the token is absent, instead of failing or pretending. `SONAR_TOKEN` is
      # created in SonarCloud and added by the repository owner; until then the step says so in the
      # log rather than leaving a red check whose cause nobody can read.
      - name: sonarcloud
        if: matrix.node-version == '22.x'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::notice title=SonarCloud::SONAR_TOKEN is not set — analysis skipped."
            echo "Add it in Settings > Secrets > Actions to replace the failing Automatic Analysis (B-126)."
            exit 0
          fi
          npx --yes sonarqube-scanner@4
