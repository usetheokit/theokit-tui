# B-126 — CI-based analysis, replacing SonarCloud's Automatic Analysis.
#
# Automatic Analysis had been FAILING on every pull request in this repository — the bot comment
# read "The last analysis has failed", which is the scan erroring rather than a quality gate
# rejecting code, and it completed in ~20-30s where a real scan of this tree takes minutes. A check
# that is red on every PR is a check nobody reads, and this repository already paid for that lesson
# once (B-122: a CI job red on `develop` for eight consecutive runs).
#
# SonarCloud disables Automatic Analysis for a project as soon as a CI-based analysis reports, so
# this file plus the workflow step is the fix rather than a second opinion alongside a broken one.

sonar.projectKey=usetheokit_theokit-tui
sonar.organization=usetheokit

# The tree, stated explicitly. Left to discovery, the scanner also reads `dist/` (gitignored build
# output) and the wiki, and then reports duplication between a source file and its own bundle.
sonar.sources=packages/tui/src
sonar.tests=packages/tui/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/dist/**,**/coverage/**,wiki/**,**/*.d.ts

# Written by `pnpm test:coverage`, which the gates job already runs.
sonar.javascript.lcov.reportPaths=packages/tui/coverage/lcov.info
